
name: Deploy LemonSlice WebGL

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy WebGL to GitHub Pages
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Repository: $GH_REPO"

          echo "Available releases:"
          gh release list

          echo "Release information:"
          gh release view webgl-v1

          echo "Release assets:"
          gh release view webgl-v1 --json assets

      - name: Download WebGL Build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release

          gh release download webgl-v1 \
            --pattern "LemonSlice-WebGL-v1.0.0.zip" \
            --dir release

          echo "Downloaded files:"
          ls -lh release

      - name: Extract WebGL Build
        run: |
          mkdir -p public

          unzip -q release/LemonSlice-WebGL-v1.0.0.zip -d public

          echo "Extracted files:"
          ls -lah public

          if [ ! -f public/index.html ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          echo "WebGL build verified."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show Deployment URL
        run: |
          echo "Deployment completed."
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
