
name: Deploy LemonSlice WebGL

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy WebGL to GitHub Pages
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Repository: $GH_REPO"
          gh release view webgl-v1 --json assets

      - name: Download WebGL Build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release

          gh release download webgl-v1 \
            --pattern "LemonSlice-WebGL-v1.0.0.zip" \
            --dir release

          ls -lh release

      - name: Extract WebGL Build
        run: |
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path, PurePosixPath

          zip_path = "release/LemonSlice-WebGL-v1.0.0.zip"
          output_dir = Path("public").resolve()
          output_dir.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(zip_path) as archive:
              for entry in archive.infolist():
                  name = entry.filename.replace("\\", "/")
                  path = PurePosixPath(name)

                  if path.is_absolute() or ".." in path.parts:
                      raise ValueError(f"Unsafe ZIP path: {name}")

                  destination = output_dir.joinpath(*path.parts)

                  if entry.is_dir() or name.endswith("/"):
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(entry) as source:
                          with destination.open("wb") as target:
                              import shutil
                              shutil.copyfileobj(source, target)

          if not (output_dir / "index.html").is_file():
              raise FileNotFoundError(
                  "index.html not found at ZIP root"
              )

          print("WebGL build extracted successfully.")
          print("Files:", os.listdir(output_dir))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show Deployment URL
        run: |
          echo "Deployment completed."
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
