
name: Deploy LemonSlice WebGL

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download WebGL release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          gh release download webgl-v1.0.0 \
            --pattern "LemonSlice-WebGL-v1.0.0.zip" \
            --dir release

      - name: Extract WebGL build
        run: |
          mkdir -p public
          unzip -q release/LemonSlice-WebGL-v1.0.0.zip -d public

          echo "WebGL build files:"
          ls -lah public

          test -f public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
